name: Production build quality
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test && npm run build
      - run: npm run test:e2e
      - name: Mobile Lighthouse on four templates
        run: |
          npm run preview > /tmp/apd-preview.log 2>&1 &
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'quality-reports', path: 'docs/*qa.json'}
